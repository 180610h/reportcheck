<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レポート添削ペン</title>
<meta name="description" content="大学レポートの文体・話し言葉・AIっぽい言い回し・出典をチェックする添削アプリ">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="添削ペン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左に原稿（入力と添削ビュー）、右に赤ペンの指摘欄。狭い画面では縦に積む */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --line:#DDE1E8; --muted:#5E6676; --ink:#1B2130;
  --pen:#C4302B; --pen-soft:#C4302B1A;
  --warn:#A8670F; --warn-soft:#E8A33A33;
  --info:#2D5DA6; --info-soft:#2D5DA61F;
  --ok:#2F7A4D; --rule:#E6EAF0;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141A; --surface:#191D25; --line:#2C323E; --muted:#9AA3B2; --ink:#E5E8EE;
  --pen:#F0736B; --pen-soft:#F0736B26; --warn:#E3B160; --warn-soft:#E3B16029;
  --info:#82A9EA; --info-soft:#82A9EA24; --ok:#6FC796; --rule:#232833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#191D25; --line:#2C323E; --muted:#9AA3B2; --ink:#E5E8EE;
  --pen:#F0736B; --pen-soft:#F0736B26; --warn:#E3B160; --warn-soft:#E3B16029;
  --info:#82A9EA; --info-soft:#82A9EA24; --ok:#6FC796; --rule:#232833; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 span{color:var(--pen)}
.lede{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:2px;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
input,select,button{font:inherit;color:var(--ink)}
input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.9rem;min-width:0}
input[type=number]{width:7.5em;font-family:var(--f-mono)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:.85rem}
.btn:hover{border-color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--pen);font-weight:700}
.tabs .spacer{flex:1}
.tabs .note{align-self:center;font-size:.75rem;color:var(--muted);padding-right:8px}
.paper{font-family:var(--f-display);font-size:1.02rem;line-height:2.1rem;padding:1.05rem 1.4rem 2rem;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.1rem - 1px),var(--rule) calc(2.1rem - 1px),var(--rule) 2.1rem);
  background-position:0 1.05rem;min-height:520px}
textarea.paper{display:block;width:100%;border:0;resize:vertical;color:var(--ink);background-color:transparent;outline:none}
#preview{white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto}
mark{background:transparent;color:inherit;border-radius:2px;cursor:pointer;text-decoration-line:underline;text-decoration-style:wavy;text-decoration-thickness:1.5px;text-underline-offset:5px}
mark.s-error{background:var(--pen-soft);text-decoration-color:var(--pen)}
mark.s-warn{background:var(--warn-soft);text-decoration-color:var(--warn)}
mark.s-info{background:var(--info-soft);text-decoration-color:var(--info)}
mark.flash{outline:2px solid var(--ink);outline-offset:2px}
mark.dim{background:transparent;text-decoration-color:transparent}

.side{display:flex;flex-direction:column;gap:16px}
.score{padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 20px;align-items:center}
.score .num{font-family:var(--f-mono);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.score .num small{font-size:1rem;color:var(--muted)}
.verdict{font-weight:700;font-size:1.05rem}
.verdict-sub{color:var(--muted);font-size:.85rem;grid-column:2}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:14px;border-top:1px dashed var(--line)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:3px}
.meter-label{grid-column:1/-1;font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

.checklist{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.checklist h2,.issues h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:500}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:.9rem;align-items:start}
.ck .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;margin-top:3px}
.ck.pass .mk{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.ck.fail .mk{background:var(--pen-soft);color:var(--pen)}
.ck.part .mk{background:var(--warn-soft);color:var(--warn)}
.ck small{display:block;color:var(--muted);font-size:.8rem;line-height:1.5}

.issues{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.item{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:6px;padding:8px 12px;text-align:left;background:transparent;width:100%;display:flex;flex-direction:column;gap:2px}
.item.s-warn{border-left-color:var(--warn)} .item.s-error{border-left-color:var(--pen)}
.item:hover{background:var(--bg)}
.item .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .cat{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.item .lbl{font-weight:700;font-size:.9rem}
.item q{font-family:var(--f-display);font-size:.88rem;color:var(--muted);quotes:"「" "」"}
.item q em{font-style:normal;color:var(--ink);background:var(--warn-soft)}
.item .tip{font-size:.82rem;line-height:1.55}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
footer{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){mark{transition:background .2s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>レポート<span>添削</span>ペン</h1>
      <p class="lede">提出前のレポートを貼り付けると、文体のゆれ・話し言葉・AIっぽい言い回し・長すぎる文・出典の有無をその場でチェックします。文章はこのブラウザの外に送られません。</p>
    </div>
    <div class="settings">
      <label class="field" for="target">目標文字数
        <input type="number" id="target" min="0" step="100" value="2000"></label>
      <label class="field" for="style">文体
        <select id="style"><option value="auto">自動判定</option><option value="dearu">だ・である調</option><option value="desu">です・ます調</option></select></label>
      <button class="btn" id="sample" type="button">サンプルに戻す</button>
      <button class="btn" id="clear" type="button">クリア</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-edit" aria-selected="false">本文を書く・貼る</button>
        <button class="tab" role="tab" id="tab-view" aria-selected="true">添削ビュー</button>
        <span class="spacer"></span>
        <span class="note" id="sampleNote">※ サンプル文を表示中</span>
      </div>
      <textarea class="paper" id="text" spellcheck="false" hidden placeholder="ここにレポート本文を貼り付けてください"></textarea>
      <div class="paper" id="preview" role="tabpanel"></div>
    </section>

    <aside class="side">
      <section class="panel score" aria-live="polite">
        <div class="num" id="score">–<small>/100</small></div>
        <div class="verdict" id="verdict">–</div>
        <div class="verdict-sub" id="verdictSub"></div>
        <div class="stats">
          <div class="stat"><b id="stChars">0</b><span>文字数</span></div>
          <div class="stat"><b id="stSent">0</b><span>文の数</span></div>
          <div class="stat"><b id="stAvg">0</b><span>平均文長</span></div>
          <div class="stat"><b id="stPara">0</b><span>段落</span></div>
        </div>
        <div class="meter"><i id="meter"></i></div>
        <div class="meter-label"><span id="meterL"></span><span id="meterR"></span></div>
      </section>

      <section class="panel checklist">
        <h2>提出前チェックリスト</h2>
        <div id="checks"></div>
      </section>

      <section class="panel issues">
        <h2>赤ペンの指摘</h2>
        <div class="legend"><span><i style="background:var(--pen)"></i>直すべき</span><span><i style="background:var(--warn)"></i>直した方がよい</span><span><i style="background:var(--info)"></i>見直し候補</span></div>
        <div class="chips" id="chips"></div>
        <div class="list" id="list"></div>
      </section>
    </aside>
  </div>
  <footer>自動チェックは目安です。「AIっぽい言い回し」は使ってはいけない言葉ではなく、多すぎると中身の薄い文章に見えやすい表現の一覧です。最終判断は自分の目で。</footer>
</div>

<script>
const SAMPLE = `SNSが大学生の情報収集に与える影響

現代社会において、SNSは私たちの生活に欠かせない存在となっている。特に大学生にとって、SNSは様々な情報を得るための重要なツールです。

なので、本レポートではSNSが大学生の情報収集にどのような影響を与えているのかについて多角的に考察し、そのメリットとデメリットを整理したうえで、今後の大学生に求められる情報リテラシーのあり方について検討していきたいと思う。

まず、SNSのメリットとしては、情報がすぐに手に入ることが挙げられる。友達とかサークルの連絡もSNSで回ってくるので、すごく便利だ。また、ニュースもSNSで見ることが多い。

一方で、SNSには誤った情報が拡散されやすいという問題もある。実際、大学生の多くがSNS上の情報を確認せずにシェアした経験があるという調査もある。また、自分と似た意見ばかりが表示されるため、考えが偏ってしまうかもしれない。

総じて、SNSは便利な反面、注意して使うことが重要であると言えるでしょう。情報の真偽を確かめる姿勢が今後ますます求められる！`;

const RULES = [
  // 話し言葉
  {cat:'話し言葉',sev:'warn',re:/(?<=(?:^|[。！？\n])[\s　]*)(なので|だから|でも|けど|だけど|あと|じゃあ)[、,]?/g,label:'文頭の話し言葉',tip:'文頭は「そのため」「したがって」「しかし」「また」などに。'},
  {cat:'話し言葉',sev:'warn',re:/とか/g,label:'「とか」',tip:'「や」「など」に置き換えます。'},
  {cat:'話し言葉',sev:'warn',re:/すごく|すごい|めっちゃ|めちゃくちゃ|超[^過越音特]|ヤバ|やば/g,label:'くだけた強調',tip:'「非常に」「大きく」、または数値や具体例で程度を示します。'},
  {cat:'話し言葉',sev:'warn',re:/やっぱり|やっぱ|ちゃんと|いろんな|いっぱい|全然|ぶっちゃけ|みたいな|ちょっと/g,label:'口語の語彙',tip:'「やはり」「きちんと」「様々な」「多くの」「まったく」「少し」など書き言葉に。'},
  {cat:'話し言葉',sev:'warn',re:/じゃない|っていう|(?<![にとおいよ])って(?=思|言)|んです|んだ(?=[。、])/g,label:'話し言葉の語尾',tip:'「ではない」「という」「のである」などに直します。'},
  {cat:'話し言葉',sev:'info',re:/友達|親友|ネット(?!ワーク)|スマホ|バイト/g,label:'くだけた名詞',tip:'「友人」「インターネット」「スマートフォン」「アルバイト」などが無難です。'},
  // AIっぽさ
  {cat:'AIっぽさ',sev:'info',re:/様々な|さまざまな|多様な/g,label:'「様々な」',tip:'何が「様々」なのか、具体的に2〜3個挙げると説得力が出ます。'},
  {cat:'AIっぽさ',sev:'info',re:/(?:欠かせない|不可欠な?|重要な(?:役割|ツール|存在)|重要である|重要です|鍵(?:となる|を握る)|カギ(?:となる|を握る))/g,label:'「重要」系の決まり文句',tip:'なぜ重要なのか、根拠（データ・事例）を一文添えるか、言い切りを具体的な主張に変えます。'},
  {cat:'AIっぽさ',sev:'info',re:/多角的|多面的|包括的|総合的/g,label:'中身のない「多角的」',tip:'実際にどの観点から見たのかを書けば、この言葉は不要になります。'},
  {cat:'AIっぽさ',sev:'info',re:/と言えるでしょう|と言えるだろう|と言えよう|ではないでしょうか|ではないだろうか/g,label:'ぼかした締め',tip:'自分の主張として「〜と考える」「〜である」と言い切れるか検討します。'},
  {cat:'AIっぽさ',sev:'info',re:/総じて|まとめると|結論として|以上のことから|このように/g,label:'定型のまとめ句',tip:'使ってよいですが、直後に新しい自分の結論が来ているか確認します。'},
  {cat:'AIっぽさ',sev:'info',re:/(?:ますます|今後(?:さらに|一層))?求められ(?:る|ている)/g,label:'「求められる」',tip:'誰に、何が、なぜ求められるのかを具体的に。'},
  {cat:'AIっぽさ',sev:'info',re:/現代社会において|現代社会では|近年、|昨今/g,label:'お決まりの書き出し',tip:'「近年」なら何年頃からか、統計や出来事で示すと具体的になります。'},
  {cat:'AIっぽさ',sev:'info',re:/(?:メリット|利点)と(?:デメリット|欠点|課題)|光と影|諸刃の剣|便利な反面/g,label:'両論併記の型',tip:'両方並べるだけで終わらず、どちらを重く見るのか自分の立場を示します。'},
  // 曖昧さ
  {cat:'曖昧さ',sev:'info',re:/と思う|と思います|と思った|と思われる|と感じる|と感じた/g,label:'「思う」「感じる」',tip:'レポートでは「〜と考える」「〜と考えられる」が基本。根拠があれば言い切ります。'},
  {cat:'曖昧さ',sev:'info',re:/かもしれない|かもしれません|気がする|ような気|のではないか/g,label:'推量のぼかし',tip:'根拠があるなら言い切り、ないなら根拠を足します。'},
  {cat:'曖昧さ',sev:'warn',re:/(?:という|との)(?:調査|研究|データ|報告|指摘)(?:も|が)ある|(?:多く|大半|ほとんど)の(?:人|学生|大学生)が|と言われている|と言われる/g,label:'出典のない根拠',tip:'誰の調査か（著者・年・機関）を本文中に示し、参考文献に載せます。'},
  // 表記
  {cat:'表記',sev:'warn',re:/[！？!?]/g,label:'感嘆符・疑問符',tip:'レポートでは原則使いません。問いかけは「〜だろうか。」で。'},
  {cat:'表記',sev:'info',re:/[Ａ-Ｚａ-ｚ０-９]+/g,label:'全角英数字',tip:'英数字は半角に統一するのが一般的です。'},
  {cat:'表記',sev:'warn',re:/[、。，．]{2,}/g,label:'句読点の重複',tip:'句読点が続いています。'},
  {cat:'表記',sev:'info',re:/(?:…|・・・|\.\.\.|〜〜|ｗ|（笑）|\(笑\))/g,label:'くだけた記号',tip:'レポートには不向きな記号です。'},
];

const $ = id => document.getElementById(id);
const ta=$('text'), pv=$('preview');
let filter=null, issues=[], usingSample=true;

function load(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('rc-draft')||'null'); }catch(e){}
  if(saved && typeof saved.text==='string' && saved.text.trim()){
    ta.value=saved.text; usingSample=false;
    if(saved.target) $('target').value=saved.target;
    if(saved.style) $('style').value=saved.style;
  } else ta.value=SAMPLE;
}
function save(){
  try{ localStorage.setItem('rc-draft',JSON.stringify(usingSample?{}:{text:ta.value,target:$('target').value,style:$('style').value})); }catch(e){}
}

function segment(text){
  const out=[]; let start=0, depth=0;
  const push=(s,e)=>{ while(s<e&&/\s/.test(text[s]))s++; while(e>s&&/\s/.test(text[e-1]))e--;
    if(e>s){const t=text.slice(s,e); out.push({s,e,t,ended:/[。！？!?]$/.test(t)});} };
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if('「『（(【'.includes(c)) depth++;
    else if('」』）)】'.includes(c)) depth=Math.max(0,depth-1);
    if(c==='\n'){ push(start,i); start=i+1; depth=0; }
    else if(depth===0 && '。！？!?'.includes(c)){ push(start,i+1); start=i+1; }
  }
  push(start,text.length);
  return out;
}
const DESU=/(です|ます|ました|でした|ません|でしょう|ましょう|ください)[」』）)]*[。！？!?]$/;
const len=s=>s.replace(/\s/g,'').length;

function analyze(text){
  const out=[];
  const sents=segment(text);
  const body=sents.filter(s=>s.ended);
  // phrase rules
  for(const r of RULES){
    r.re.lastIndex=0;
    for(const m of text.matchAll(r.re)){
      if(!m[0]) continue;
      out.push({s:m.index,e:m.index+m[0].length,cat:r.cat,sev:r.sev,label:r.label,tip:r.tip});
    }
  }
  // 文体
  const desu=body.filter(s=>DESU.test(s.t)), dearu=body.filter(s=>!DESU.test(s.t));
  let mode=$('style').value;
  if(mode==='auto') mode = desu.length>dearu.length?'desu':'dearu';
  const wrong = mode==='desu'?dearu:desu;
  if(desu.length && dearu.length || $('style').value!=='auto'){
    for(const s of wrong){
      const m=s.t.match(/[^、。]{0,8}[。！？!?]$/);
      const st=s.e-(m?m[0].length:1);
      out.push({s:st,e:s.e,cat:'文体',sev:'error',label:mode==='desu'?'です・ます調に混ざった常体':'だ・である調に混ざった敬体',
        tip:mode==='desu'?'文末を「です・ます」にそろえます。':'文末を「だ・である」にそろえます（例：重要です→重要である）。'});
    }
  }
  // 文の長さ・読点
  for(const s of body){
    const L=len(s.t), commas=(s.t.match(/[、，]/g)||[]).length;
    if(L>100) out.push({s:s.s,e:s.e,cat:'読みやすさ',sev:'warn',label:`長すぎる文（${L}字）`,tip:'1文はおおむね60〜80字以内に。「〜し、〜して、〜ので」の途中で文を切ります。',whole:true});
    else if(L>80) out.push({s:s.s,e:s.e,cat:'読みやすさ',sev:'info',label:`やや長い文（${L}字）`,tip:'2文に分けられないか検討します。',whole:true});
    if(L>55 && commas===0) out.push({s:s.s,e:s.e,cat:'読みやすさ',sev:'info',label:'読点がない長い文',tip:'意味の切れ目に「、」を入れます。',whole:true});
  }
  // 文末の単調さ・接続詞の連続
  for(let i=2;i<body.length;i++){
    const tail=x=>x.t.replace(/[」』）)]*[。！？!?]$/,'').slice(-2);
    if(tail(body[i])===tail(body[i-1]) && tail(body[i])===tail(body[i-2])){
      out.push({s:body[i].e-3,e:body[i].e,cat:'読みやすさ',sev:'info',label:`同じ文末が3回連続（〜${tail(body[i])}。）`,tip:'文末に変化をつけると単調さが消えます。'});
    }
  }
  const CONJ=/^(また|さらに|そして|しかし|一方で|つまり|まず|次に)/;
  for(let i=1;i<body.length;i++){
    const a=body[i-1].t.match(CONJ), b=body[i].t.match(CONJ);
    if(a&&b&&a[1]===b[1]) out.push({s:body[i].s,e:body[i].s+b[1].length,cat:'読みやすさ',sev:'info',label:`接続詞「${b[1]}」の連続`,tip:'同じ接続詞が続いています。'});
  }
  const cMata=body.filter(s=>/^また[、,]/.test(s.t)).length;
  out.sort((a,b)=>a.s-b.s||b.e-a.e);
  return {issues:out,sents,body,mode,desu:desu.length,dearu:dearu.length,cMata};
}

function docChecks(text,res){
  const chars=len(text), target=+$('target').value||0;
  const paras=text.split(/\n/).filter(l=>/[。！？]/.test(l)).length;
  const hasRefs=/参考文献|引用文献|出典[:：]|References|Bibliography/i.test(text);
  const inText=/[（(][^（()）\n]{1,40}[,，、]\s*(?:19|20)\d{2}[a-z]?[）)]|[（(](?:19|20)\d{2}[）)]|\[\d+\]|https?:\/\//.test(text);
  const own=/(?:私|筆者|自分)は[^。]{0,60}(?:考え|主張|見解|立場)|と考える|べきである/.test(text);
  const concl=/(?:^|\n)\s*(?:おわりに|結論|まとめ|結び)|以上(?:の|から)|本レポートでは[^。]*(?:明らかに|示した|述べた)/.test(text);
  const out=[];
  let lenState='pass', lenNote=`${chars}字`;
  if(target){ const r=chars/target;
    if(r<0.8){lenState='fail';lenNote=`${chars}字 / 目標${target}字（あと${target-chars}字）`;}
    else if(r<0.9||r>1.1){lenState='part';lenNote=`${chars}字 / 目標${target}字（目安の±10%から外れています）`;}
    else lenNote=`${chars}字 / 目標${target}字`; }
  out.push({state:lenState,label:'文字数',note:lenNote});
  out.push({state:res.desu&&res.dearu?'fail':'pass',label:'文体の統一',note:res.desu&&res.dearu?`だ・である調${res.dearu}文、です・ます調${res.desu}文が混在`:(res.mode==='desu'?'です・ます調でそろっています':'だ・である調でそろっています')});
  out.push({state:hasRefs&&inText?'pass':hasRefs||inText?'part':'fail',label:'出典・参考文献',note:hasRefs&&inText?'本文中の引用と参考文献リストがあります':hasRefs?'参考文献リストはありますが、本文中の引用表示（著者, 年）が見当たりません':inText?'本文中の引用はありますが、末尾に参考文献リストがありません':'出典が見当たりません。調査やデータに触れるなら必須です'});
  out.push({state:own?'pass':'fail',label:'自分の考え',note:own?'自分の主張・考察が書かれています':'「私は〜と考える」のような自分の主張が見当たりません'});
  out.push({state:paras>=4?'pass':paras>=3?'part':'fail',label:'構成（序論・本論・結論）',note:`段落 ${paras}つ`+(concl?'・結論部あり':'・明確な結論の見出しや締めの一文がありません')});
  return {list:out,chars,paras,target};
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const text=ta.value;
  const res=analyze(text); issues=res.issues;
  const doc=docChecks(text,res);
  // preview marks (no overlap; keep earliest/longest, prefer non-whole)
  const ranked=issues.map((x,i)=>({...x,i})).sort((a,b)=>(a.whole?1:0)-(b.whole?1:0)||a.s-b.s);
  const taken=[]; const marks=[];
  for(const x of ranked){ if(taken.some(t=>x.s<t.e&&t.s<x.e)) continue; taken.push(x); marks.push(x); issues[x.i].marked=true; }
  marks.sort((a,b)=>a.s-b.s);
  let html='',p=0;
  for(const m of marks){ html+=esc(text.slice(p,m.s))+`<mark class="s-${m.sev}" data-i="${m.i}" data-cat="${m.cat}" title="${esc(m.label)}">${esc(text.slice(m.s,m.e))}</mark>`; p=m.e; }
  html+=esc(text.slice(p));
  pv.innerHTML=html||'<span style="color:var(--muted)">本文がありません。「本文を書く・貼る」タブから貼り付けてください。</span>';

  // stats
  $('stChars').textContent=doc.chars.toLocaleString();
  $('stSent').textContent=res.body.length;
  $('stAvg').textContent=res.body.length?Math.round(res.body.reduce((a,s)=>a+len(s.t),0)/res.body.length):0;
  $('stPara').textContent=doc.paras;
  const r=doc.target?Math.min(1,doc.chars/doc.target):0;
  $('meter').style.width=(r*100)+'%';
  $('meter').style.background=doc.list[0].state==='pass'?'var(--ok)':doc.list[0].state==='part'?'var(--warn)':'var(--pen)';
  $('meterL').textContent=doc.target?`目標まで ${Math.round(r*100)}%`:'目標文字数なし';
  $('meterR').textContent=doc.target?`${doc.chars.toLocaleString()} / ${doc.target.toLocaleString()}字`:'';

  // score
  const w={error:4,warn:2.5,info:0.8};
  let pen=issues.reduce((a,x)=>a+w[x.sev],0);
  pen=Math.min(pen,60);
  pen+=doc.list.reduce((a,c)=>a+(c.state==='fail'?8:c.state==='part'?3:0),0);
  const score=text.trim()?Math.max(0,Math.round(100-pen)):0;
  $('score').innerHTML=`${score}<small>/100</small>`;
  const v=score>=85?['提出できる状態です','細かい見直し候補だけ確認しましょう','var(--ok)']:score>=65?['もう一息','黄・赤の指摘を直すと読みやすくなります','var(--warn)']:['要修正','チェックリストの赤い項目から直しましょう','var(--pen)'];
  $('verdict').textContent=text.trim()?v[0]:'–'; $('verdict').style.color=v[2];
  $('verdictSub').textContent=text.trim()?v[1]:'';
  $('score').style.color=text.trim()?v[2]:'';

  // checklist
  $('checks').innerHTML=doc.list.map(c=>`<div class="ck ${c.state}"><span class="mk">${c.state==='pass'?'✓':c.state==='part'?'△':'✕'}</span><div>${esc(c.label)}<small>${esc(c.note)}</small></div></div>`).join('');

  // chips
  const cats={}; issues.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);
  if(filter&&!cats[filter]) filter=null;
  $('chips').innerHTML=`<button class="chip" data-c="" aria-pressed="${!filter}">すべて <b>${issues.length}</b></button>`+
    Object.entries(cats).map(([c,n])=>`<button class="chip" data-c="${c}" aria-pressed="${filter===c}">${c} <b>${n}</b></button>`).join('');

  // list
  const order={error:0,warn:1,info:2};
  const shown=issues.map((x,i)=>({...x,i})).filter(x=>!filter||x.cat===filter).sort((a,b)=>order[a.sev]-order[b.sev]||a.s-b.s);
  $('list').innerHTML=shown.length?shown.map(x=>{
    const a=Math.max(0,x.s-(x.whole?0:10)), b=Math.min(text.length,x.whole?Math.min(x.e,x.s+46):x.e+10);
    const hit=text.slice(x.s,Math.min(x.e,b));
    const q=(a>0?'…':'')+esc(text.slice(a,x.s))+`<em>${esc(hit)}</em>`+esc(text.slice(Math.min(x.e,b),b))+(b<text.length?'…':'');
    return `<button class="item s-${x.sev}" data-i="${x.i}" type="button"><span class="top"><span class="lbl">${esc(x.label)}</span><span class="cat">${x.cat}</span></span><q>${q.replace(/\n/g,' ')}</q><span class="tip">${esc(x.tip)}</span></button>`;
  }).join(''):`<p class="empty">${text.trim()?'このカテゴリの指摘はありません。':'本文を入れると指摘がここに並びます。'}</p>`;
  pv.querySelectorAll('mark').forEach(m=>m.classList.toggle('dim',!!filter&&m.dataset.cat!==filter));
  $('sampleNote').hidden=!usingSample;
}

function setTab(view){
  $('tab-edit').setAttribute('aria-selected',!view); $('tab-view').setAttribute('aria-selected',view);
  ta.hidden=view; pv.hidden=!view;
  if(!view) ta.focus();
}
function jump(i){
  setTab(true);
  const m=pv.querySelector(`mark[data-i="${i}"]`);
  if(!m){ // overlapped: find the mark covering it
    const x=issues[i]; const all=[...pv.querySelectorAll('mark')];
    const c=all.find(el=>{const y=issues[+el.dataset.i];return y.s<=x.s&&y.e>=x.s;}); if(c) return flash(c);
    return;
  }
  flash(m);
}
function flash(m){
  m.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  m.classList.add('flash'); setTimeout(()=>m.classList.remove('flash'),1400);
}

let t;
ta.addEventListener('input',()=>{usingSample=false;clearTimeout(t);t=setTimeout(()=>{render();save();},250);});
['target','style'].forEach(id=>$(id).addEventListener('input',()=>{render();save();}));
$('tab-edit').onclick=()=>setTab(false);
$('tab-view').onclick=()=>setTab(true);
$('sample').onclick=()=>{ta.value=SAMPLE;usingSample=true;render();save();setTab(true);};
$('clear').onclick=()=>{ta.value='';usingSample=false;render();save();setTab(false);};
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.c||null;render();});
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)jump(+b.dataset.i);});
pv.addEventListener('click',e=>{const m=e.target.closest('mark');if(!m)return;
  const it=$('list').querySelector(`.item[data-i="${m.dataset.i}"]`);
  if(it){it.scrollIntoView({block:'nearest'});it.focus();}});
pv.addEventListener('dblclick',()=>setTab(false));

load(); render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>

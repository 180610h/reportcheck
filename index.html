<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>レポート添削ペン</title>
<meta name="description" content="レポートのファイル（PDF・Word・写真）や文章を送ると、AIが8つの観点で採点し、一覧表とコメントで返すチャット型の添削アプリ">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="添削ペン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>レポート<b>添削</b>ペン</span></div>
    <div class="top-act">
      <button class="btn" id="openRecords" type="button">採点の記録<span class="badge" id="recCount">0</span></button>
      <button class="btn" id="openSettings" type="button"><span class="dot" id="aiDot"></span>AI設定</button>
    </div>
  </div>
</header>

<main class="thread" id="thread" aria-live="polite"></main>

<div class="dock">
  <form class="composer" id="composer">
    <div class="cond" id="cond" hidden>
      <label class="field f-task" for="task">課題文（任意）
        <textarea id="task" rows="2" placeholder="例：〇〇について、具体的な資料に基づいて論じなさい。"></textarea></label>
      <label class="field" for="level">水準
        <select id="level"><option>学部1・2年</option><option>学部3・4年</option><option>卒業論文</option><option>大学院</option></select></label>
      <label class="field" for="field">分野
        <select id="field"><option>指定なし</option><option>人文学</option><option>社会科学</option><option>経済・経営</option><option>法学</option><option>教育学</option><option>心理学</option><option>理工学</option><option>情報</option><option>医療・看護・福祉</option><option>芸術</option></select></label>
      <label class="field" for="target">目標文字数
        <input type="number" id="target" min="0" step="100" value="2000" inputmode="numeric"></label>
    </div>
    <div class="att" id="att" hidden></div>
    <textarea id="input" rows="2" placeholder="レポート本文を貼り付けるか、ファイルを添付してください。採点後は質問もできます。"></textarea>
    <div class="bar-row">
      <button class="btn icon" id="attach" type="button" aria-label="ファイルを添付"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16.5 6.5 8.4 14.6a2 2 0 0 0 2.8 2.8l8-8a4 4 0 0 0-5.6-5.6l-8.1 8.1a6 6 0 0 0 8.5 8.5L20 14.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl">ファイル</span></button>
      <input type="file" id="fileInput" multiple hidden>
      <button class="btn ghost" id="condToggle" type="button" aria-expanded="false"><span id="condSummary">学部1・2年・2000字</span> ▾</button>
      <span class="spacer"></span>
      <button class="btn" id="askBtn" type="submit" value="ask" disabled>質問する</button>
      <button class="btn pen" id="gradeBtn" type="submit" value="grade">採点する</button>
    </div>
  </form>
</div>

<div id="drop" hidden><div>ここにファイルをドロップ<small>PDF・Word（.docx）・写真やスキャン画像・テキスト</small></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<dialog id="settings">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>AI設定</h2>
    <div class="seg" role="radiogroup" aria-label="接続方法">
      <label><input type="radio" name="mode" value="direct" checked>APIキーを使う</label>
      <label><input type="radio" name="mode" value="proxy">大学の中継サーバー</label>
    </div>
    <div class="stack" id="directBox">
      <label class="field" for="apiKey">Anthropic APIキー
        <input type="password" id="apiKey" autocomplete="off" placeholder="sk-ant-..."></label>
      <label class="row"><input type="checkbox" id="remember" checked>この端末に保存する（共用PCではオフに）</label>
      <p class="sub">キーは platform.claude.com で発行できます（従量課金）。キーはこの端末のブラウザにだけ保存され、Anthropic のAPI以外には送られません。</p>
    </div>
    <div class="stack" id="proxyBox" hidden>
      <label class="field" for="proxyUrl">中継サーバーのURL
        <input type="url" id="proxyUrl" placeholder="https://report-ai.example.workers.dev"></label>
      <label class="field" for="accessCode">アクセスコード（配布されている場合）
        <input type="password" id="accessCode" autocomplete="off"></label>
    </div>
    <label class="field" for="model">モデル
      <select id="model"></select></label>
    <p class="sub" id="priceNote"></p>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>閉じる</button>
      <button class="btn primary" value="save" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="records">
  <div class="dlg">
    <div class="dlg-title"><h2>採点の記録</h2><button class="btn" id="closeRecords" type="button">閉じる</button></div>
    <p class="sub">採点した結果は自動でこの端末に保存されます。2つ選ぶと点数の変化を比較できます。</p>
    <div class="stack" id="recList"></div>
    <div class="row wrap"><button class="btn ai" id="cmpRecords" type="button" disabled>選んだ2つを比較</button>
      <span class="spacer"></span>
      <button class="btn" id="exportBk" type="button">バックアップを書き出す</button>
      <button class="btn" id="importBk" type="button">読み込む</button>
      <input type="file" id="bkInput" accept=".json,application/json" hidden></div>
    <div id="recCmp"></div>
  </div>
</dialog>

<script src="js/files.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
